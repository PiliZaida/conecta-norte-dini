services:
  - type: web
    name: conecta-norte-dini
    runtime: python
    plan: free
    buildCommand: echo "Sin dependencias externas"
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DINI_CODES
        sync: false
      - key: DINI_SESSION_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: DINI_HTTPS
        value: '1'

services:
  - type: web
    name: conecta-norte-dini
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DINI_CODES
        sync: false
      - key: DINI_SESSION_SECRET
        generateValue: true
